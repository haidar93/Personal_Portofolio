<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontak Saya</title>
  <link rel="stylesheet" href="style.css"> 
</head>
<body>
  <!-- Navbar kecil (biar bisa balik ke Home) -->
  <nav>
    <a href="index.html" class="logo">⬅ Kembali</a>
  </nav>

  <section class="contact-section">
    <h1>Hubungi Saya</h1>
    <p>Silakan kirim pesan melalui form di bawah ini.</p>

    <form class="contact-form" action="https://formsubmit.co/xten748@gmail.com" method="POST">
  <!-- matikan captcha -->
  <input type="hidden" name="_captcha" value="false">

  <!-- redirect setelah sukses kirim -->
  <input type="hidden" name="_next" value="index.html">

  <label for="nama">Nama</label>
  <input type="text" id="nama" name="nama" placeholder="Tulis nama kamu" required>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" placeholder="contoh@email.com" required>

  <label for="pesan">Pesan</label>
  <textarea id="pesan" name="pesan" rows="5" placeholder="Tulis pesan kamu di sini..." required></textarea>

  <button type="submit" class="btn">Kirim</button>
</form>

  </section>
</body>
</html>
